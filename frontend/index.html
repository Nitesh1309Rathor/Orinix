    <!-- Environment & Extension Fetch Setter Polyfill -->
    <script>
      (function() {
        try {
          var _nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = _nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Prevent external browser extension errors from breaking application flow
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension:') !== -1) ||
            (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>

    <title>ORIONIX — Vedic Skincare & Botanical Wellness</title>
